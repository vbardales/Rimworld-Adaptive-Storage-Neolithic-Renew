name: Mod static tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  xml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate XML and upstream architecture contracts
        shell: pwsh
        run: ./tests/Test-Mod.ps1
      - name: Validate translated def targets
        shell: pwsh
        run: ./tests/Test-InstalledTranslations.ps1
