<!doctype html>
<meta charset="utf-8">
<title>Preview</title>
<style>
  /* The page IS the banner: 896 x 504, no margin, no scrollbar. Chrome headless
     screenshots it at exactly this size, so the text is composed at its final
     size and the glyphs are never resampled. The background image is the
     full-resolution source, scaled here rather than beforehand. */
  html, body { margin: 0; padding: 0; }
  body { width: 896px; height: 504px; overflow: hidden; }

  /* The source is 1359 x 1158, which is nowhere near 16:9, so the crop happens
     here rather than in a separate pass. Scaled to 896 wide (a factor of
     0.6593) and pulled up by 43.5px, the visible band is source rows 66 to 830.
     That window is the one arbitration this banner needed: the content spans
     more height than a 16:9 frame at full width can hold, so either the torch
     flame at the top or the plinth at the bottom had to go. The torch stays,
     because it is what motivates the light, and the plinth's stone base meets
     the frame edge with the figurine whole above it. Cropping lower instead cut
     the grain basket, which is the mod's hero object. */
  .frame {
    position: relative;
    width: 896px; height: 504px;
    background: url("../Art/Preview-source.png") 0 -43.5px / 896px auto no-repeat;
  }

  /* Radial darkening from the top-left corner, so the title sits on a calm
     ground without a visible rectangle. Values from STYLE_RIMWORLD.md. */
  .frame::after {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 0% 0%,
                rgba(6, 5, 4, .86) 0%,
                rgba(6, 5, 4, 0) 74%);
  }

  .text {
    position: absolute; z-index: 1;
    left: 50px; top: 52px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #ECE2CD;
    text-shadow: 0 3px 10px rgba(0, 0, 0, .75);
  }

  /* 42px over two lines. The name is 31 characters: on one line it would run
     past the grain basket and into the lit half of the room. Broken after
     "Storage" both lines stay inside the calm left third. */
  h1 {
    margin: 0;
    font-size: 42px; font-weight: 600; line-height: 1.1;
    letter-spacing: .2px;
  }

  .rule {
    width: 58px; height: 3px;
    background: #D68F2C;
    margin: 20px 0 16px;
  }

  /* English, because the About is: STYLE_RIMWORLD.md ties the summary line to
     the language of the mod's own store page, not to the repository's. No count
     is engraved: the three patches build one pot, one plinth and one chunk
     stack per stone chunk IN THE GAME, so the number moves with the expansions
     and mods installed - exactly the case the counting rule refuses. */
  p {
    margin: 0;
    width: 430px;
    font-size: 21px; font-weight: 400; line-height: 1.45;
    color: rgba(236, 226, 205, .88);
  }
</style>

<div class="frame">
  <div class="text">
    <h1>Adaptive Storage<br>Neolithic Renew</h1>
    <div class="rule"></div>
    <p>Neolithic storage for the Adaptive Storage Framework: every container shows what is inside it.</p>
  </div>
</div>
